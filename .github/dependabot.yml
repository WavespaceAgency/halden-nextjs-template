# Keeps dependencies up to date with weekly pull requests (grouped to keep the noise low).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Major versions can need code changes – upgrade those by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      next-react:
        patterns: ["next", "@next/*", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      mdx:
        patterns: ["@mdx-js/*", "remark-*", "rehype-*", "@types/mdx"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
